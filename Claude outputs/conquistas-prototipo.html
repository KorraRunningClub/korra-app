body{margin:0;background:#E9E8D6;color:#1f251e;font-family:Inter,system-ui,sans-serif;padding:24px 16px}
h1{font-family:Archivo,sans-serif;font-weight:900;margin:0 0 6px}p.sub{margin:0 0 24px;color:#4a5248}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:24px;max-width:900px}
.conq{background:none;border:0;padding:0;cursor:pointer;perspective:800px;text-align:center;font:inherit;color:inherit}
.moeda{position:relative;width:150px;height:150px;margin:0 auto;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:50%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28))}
.face svg{width:100%;height:100%;display:block}
.verso{transform:rotateY(180deg);background:radial-gradient(circle at 40% 35%,#3d4a3c,#1f251e);border:5px solid var(--anel);display:grid;place-content:center;gap:5px;padding:16px;color:#E9E8D6;box-sizing:border-box}
.verso b{font-family:Archivo,sans-serif;font-size:15px;line-height:1.1}
.verso small{font-size:11.5px;line-height:1.3;opacity:.85}
.verso .barra{height:6px;border-radius:3px;background:rgba(233,232,214,.2);overflow:hidden;width:90px;margin:2px auto 0}
.verso .barra span{display:block;height:100%;background:#FED261}
.conq.virada .moeda{transform:rotateY(180deg)}
@media (hover:hover) and (pointer:fine){.conq:hover .moeda{transform:rotateY(180deg)}}
.nome{margin-top:12px;font-family:Archivo,sans-serif;font-weight:700;font-size:15px}
.nivel{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6b7369}
</style></head><body>
